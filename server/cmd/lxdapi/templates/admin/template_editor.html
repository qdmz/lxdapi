<!DOCTYPE html>
<html lang='zh-CN' data-theme='light'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>{{ .title }} - 模板编辑器</title>
    {{if .FaviconUrl}}<link rel='icon' href='{{.FaviconUrl}}'>{{end}}
    {{if .UseLocalCDN}}
    <link href='/static/css/daisyui.min.css' rel='stylesheet'>
    <script src='/static/js/tailwindcss.js'></script>
    <script src='/static/js/jquery.min.js'></script>
    {{else}}
    <link href='https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css' rel='stylesheet'>
    <script src='https://cdn.tailwindcss.com'></script>
    <script src='https://code.jquery.com/jquery-3.7.1.min.js'></script>
    {{end}}
    <style>
        body { font-family: 'Inter', sans-serif; }
        #editor {
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace;
            font-size: 13px;
            line-height: 1.5;
            tab-size: 4;
            white-space: pre;
            overflow-wrap: normal;
        }
        .file-item.active {
            background-color: #dbeafe !important;
            color: #1d4ed8 !important;
            font-weight: 600;
        }
        .file-item:hover { background-color: #f1f5f9; }
    </style>
</head>
<body class='min-h-screen flex flex-col'>
    {{template "admin/admin_header.html" .}}

    <div class='flex-1' style='{{if .BgImage}}background-image: url({{.BgImage}}); background-size: cover; background-position: center; background-attachment: fixed;{{else}}background-color: #f9fafb;{{end}}'>
        <div class='container mx-auto px-4 py-8'>
            <div class='flex flex-col lg:flex-row lg:justify-between lg:items-center gap-4 mb-6'>
                <div class='px-4 py-3 rounded-lg shadow-sm' style='background-color: rgba(255,255,255,0.85);'>
                    <h1 class='text-2xl lg:text-3xl font-bold text-gray-800 flex items-center gap-3'>
                        <span class='iconify text-blue-600' data-icon='mdi:file-document-edit-outline' data-width='28'></span>
                        模板编辑器
                    </h1>
                    <p class='text-sm text-gray-600 mt-1'>在线编辑 HTML 模板，保存后立即热加载生效，无需重启</p>
                </div>
                <a href='/admin/dashboard' class='btn btn-sm btn-ghost'>返回仪表盘</a>
            </div>

            <div class='grid grid-cols-1 lg:grid-cols-4 gap-4'>
                <div class='lg:col-span-1'>
                    <div class='card bg-white shadow-sm'>
                        <div class='card-body p-3'>
                            <input id='search' type='text' placeholder='搜索文件名...' class='input input-bordered input-sm w-full mb-2'>
                            <div id='fileList' class='space-y-1 overflow-y-auto' style='max-height: 70vh;'>
                                <div class='text-sm text-gray-400 p-2'>加载中...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class='lg:col-span-3'>
                    <div class='card bg-white shadow-sm'>
                        <div class='card-body p-4'>
                            <div class='flex items-center justify-between mb-2'>
                                <div class='text-sm font-medium text-gray-700'>
                                    当前文件：<span id='currentPath' class='text-blue-600'>未选择</span>
                                    <span id='dirtyFlag' class='hidden badge badge-warning badge-sm ml-2'>未保存</span>
                                </div>
                                <div class='flex gap-2'>
                                    <button id='previewBtn' class='btn btn-sm btn-outline'>预览</button>
                                    <button id='reloadBtn' class='btn btn-sm btn-outline'>重新加载模板</button>
                                    <button id='saveBtn' class='btn btn-sm btn-primary' disabled>保存</button>
                                </div>
                            </div>
                            <textarea id='editor' class='textarea textarea-bordered w-full font-mono' style='height: 65vh;' placeholder='请选择左侧模板文件进行编辑'></textarea>
                            <div id='status' class='text-sm mt-2 min-h-[20px]'></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <dialog id='previewModal' class='modal'>
        <div class='modal-box w-11/12 max-w-5xl h-[85vh] flex flex-col p-0'>
            <div class='flex items-center justify-between px-4 py-3 border-b'>
                <h3 class='font-bold'>预览：<span id='previewPath' class='text-blue-600'></span></h3>
                <div class='flex items-center gap-2'>
                    <label class='cursor-pointer label gap-2'>
                        <span class='label-text text-sm'>自动刷新</span>
                        <input id='autoRefresh' type='checkbox' class='toggle toggle-sm' checked>
                    </label>
                    <button id='closePreview' class='btn btn-sm btn-ghost'>关闭</button>
                </div>
            </div>
            <iframe id='previewFrame' class='flex-1 w-full border-0 bg-white'></iframe>
        </div>
        <form method='dialog' class='modal-backdrop'><button>关闭</button></form>
    </dialog>

    {{template "admin/admin_footer.html" .}}

    <script>
    (function () {
        var currentPath = null;
        var originalContent = '';
        var previewTimer = null;

        function setStatus(msg, isError) {
            var el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'text-sm mt-2 min-h-[20px] ' + (isError ? 'text-red-600' : 'text-green-600');
        }

        function loadList() {
            fetch('/api/admin/template-files', { credentials: 'same-origin' })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.code !== 200) { setStatus('加载列表失败: ' + data.msg, true); return; }
                    renderList(data.data.files || []);
                })
                .catch(function (e) { setStatus('加载列表出错: ' + e, true); });
        }

        function renderList(files) {
            var box = document.getElementById('fileList');
            var keyword = document.getElementById('search').value.trim().toLowerCase();
            box.innerHTML = '';
            if (!files.length) { box.innerHTML = '<div class="text-sm text-gray-400 p-2">无模板文件</div>'; return; }
            files.forEach(function (f) {
                if (keyword && f.path.toLowerCase().indexOf(keyword) === -1) return;
                var div = document.createElement('div');
                div.className = 'file-item text-sm px-2 py-1.5 rounded cursor-pointer ' + (f.path === currentPath ? 'active' : '');
                div.textContent = f.path;
                div.title = '大小: ' + f.size + ' 字节\n修改: ' + f.modTime;
                div.onclick = function () { selectFile(f.path); };
                box.appendChild(div);
            });
        }

        function selectFile(path) {
            fetch('/api/admin/template-files/content?path=' + encodeURIComponent(path), { credentials: 'same-origin' })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.code !== 200) { setStatus('读取失败: ' + data.msg, true); return; }
                    currentPath = path;
                    originalContent = data.data.content;
                    document.getElementById('editor').value = originalContent;
                    document.getElementById('currentPath').textContent = path;
                    document.getElementById('saveBtn').disabled = false;
                    setDirty(false);
                    setStatus('已加载: ' + path, false);
                    renderListCurrent();
                })
                .catch(function (e) { setStatus('读取出错: ' + e, true); });
        }

        function renderListCurrent() {
            var box = document.getElementById('fileList');
            Array.prototype.forEach.call(box.children, function (c) {
                if (c.classList && c.classList.contains('file-item')) {
                    c.classList.toggle('active', c.textContent === currentPath);
                }
            });
        }

        function setDirty(dirty) {
            var flag = document.getElementById('dirtyFlag');
            if (dirty) { flag.classList.remove('hidden'); } else { flag.classList.add('hidden'); }
        }

        function save() {
            if (!currentPath) return;
            var content = document.getElementById('editor').value;
            setStatus('保存中...', false);
            fetch('/api/admin/template-files/save', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: currentPath, content: content })
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data.code !== 200) { setStatus('保存失败: ' + data.msg, true); return; }
                originalContent = content;
                setDirty(false);
                setStatus('保存成功，模板已热加载: ' + currentPath, false);
            })
            .catch(function (e) { setStatus('保存出错: ' + e, true); });
        }

        function reloadAll() {
            fetch('/api/admin/template-files/reload', { method: 'POST', credentials: 'same-origin' })
                .then(function (r) { return r.json(); })
                .then(function (data) { setStatus(data.msg || '已重新加载', false); })
                .catch(function (e) { setStatus('重新加载出错: ' + e, true); });
        }

        function doPreview() {
            if (!currentPath) { setStatus('请先选择文件再预览', true); return; }
            var content = document.getElementById('editor').value;
            setStatus('预览生成中...', false);
            fetch('/api/admin/template-files/preview', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: currentPath, content: content })
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data.code !== 200) { setStatus('预览失败: ' + data.msg, true); return; }
                document.getElementById('previewPath').textContent = currentPath;
                document.getElementById('previewFrame').srcdoc = data.data.html;
                setStatus('预览已生成', false);
            })
            .catch(function (e) { setStatus('预览出错: ' + e, true); });
        }

        function openPreview() {
            var modal = document.getElementById('previewModal');
            if (modal.showModal) { modal.showModal(); } else { modal.classList.add('modal-open'); }
            doPreview();
            if (previewTimer) clearInterval(previewTimer);
            previewTimer = setInterval(function () {
                var cb = document.getElementById('autoRefresh');
                if (!cb || cb.checked) { doPreview(); }
            }, 1500);
        }

        function closePreview() {
            var modal = document.getElementById('previewModal');
            if (modal.close) { modal.close(); }
            if (previewTimer) { clearInterval(previewTimer); previewTimer = null; }
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('search').addEventListener('input', function () { loadList(); });
            document.getElementById('editor').addEventListener('input', function () {
                setDirty(this.value !== originalContent);
            });
            document.getElementById('saveBtn').addEventListener('click', save);
            document.getElementById('reloadBtn').addEventListener('click', reloadAll);
            document.getElementById('previewBtn').addEventListener('click', openPreview);
            document.getElementById('closePreview').addEventListener('click', closePreview);
            loadList();
        });
    })();
    </script>
</body>
</html>
