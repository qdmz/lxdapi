<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    {{if .FaviconUrl}}<link rel="icon" href="{{.FaviconUrl}}">{{end}}
    {{if .UseLocalCDN}}
    <link href="/static/css/daisyui.min.css" rel="stylesheet">
    <script src="/static/js/tailwindcss.js"></script>
    <script src="/static/js/jquery.min.js"></script>
    {{else}}
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    {{end}}
</head>
<body class="min-h-screen flex flex-col" style="background-color:#f9fafb">
{{template "admin/admin_header.html" .}}
<div class="flex-1" style="background-color: #f9fafb;">
<div class="max-w-6xl mx-auto px-3 sm:px-4 lg:px-6 py-4 sm:py-6">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4 sm:mb-6">
        <div>
            <h1 class="text-lg sm:text-xl font-bold text-gray-800 flex items-center gap-2">
                <span class="iconify" data-icon="mdi:ticket-outline" data-width="20"></span>工单管理
            </h1>
            <p class="text-xs sm:text-sm text-gray-500 mt-1">处理用户提交的工单，支持回复与关闭。</p>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-3 sm:p-4 mb-4">
        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
            <select id="filterStatus" class="px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500 min-w-[120px]">
                <option value="">全部状态</option>
                <option value="open">待处理</option>
                <option value="pending">待用户确认</option>
                <option value="closed">已关闭</option>
            </select>
            <button onclick="loadTickets()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition">查询</button>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-x-auto">
        <table class="min-w-full text-sm">
            <thead>
                <tr class="bg-gray-50 text-gray-600">
                    <th class="px-4 py-3 text-left font-medium">ID</th>
                    <th class="px-4 py-3 text-left font-medium">标题</th>
                    <th class="px-4 py-3 text-left font-medium">用户</th>
                    <th class="px-4 py-3 text-left font-medium">类型</th>
                    <th class="px-4 py-3 text-left font-medium">优先级</th>
                    <th class="px-4 py-3 text-left font-medium">状态</th>
                    <th class="px-4 py-3 text-left font-medium">创建时间</th>
                    <th class="px-4 py-3 text-right font-medium">操作</th>
                </tr>
            </thead>
            <tbody id="ticketTable"></tbody>
        </table>
    </div>
</div>

<script>
var API = '/api/admin';

function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}
function fmtTime(s) {
    if (!s) return '-';
    return String(s).replace('T', ' ').substring(0, 19);
}
function statusBadge(s) {
    var map = {
        open: ['待处理', 'bg-amber-100 text-amber-700'],
        pending: ['待确认', 'bg-blue-100 text-blue-700'],
        closed: ['已关闭', 'bg-gray-200 text-gray-600']
    };
    var m = map[s] || [s, 'bg-gray-100 text-gray-600'];
    return '<span class="px-2 py-0.5 rounded-full text-xs ' + m[1] + '">' + m[0] + '</span>';
}
function priorityBadge(p) {
    var map = { low: '低', normal: '普通', high: '高', urgent: '紧急' };
    return esc(map[p] || p || '普通');
}
function typeLabel(t) {
    var map = { billing: '计费', technical: '技术', other: '其他' };
    return esc(map[t] || t || '其他');
}

function loadTickets() {
    var status = document.getElementById('filterStatus').value;
    var url = API + '/tickets';
    if (status) url += '?status=' + encodeURIComponent(status);
    $.get(url, function (r) {
        if (r.code !== 200) { alert(r.msg || '加载失败'); return; }
        renderTickets((r.data && r.data.list) || []);
    });
}

function renderTickets(list) {
    var tbody = document.getElementById('ticketTable');
    if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="px-4 py-8 text-center text-gray-400">暂无工单</td></tr>';
        return;
    }
    tbody.innerHTML = list.map(function (t) {
        var acts = [];
        acts.push('<a class="text-blue-600 hover:underline text-sm mr-2" href="/admin/tickets/' + t.id + '">详情</a>');
        if (t.status !== 'closed') {
            acts.push('<button class="text-green-600 hover:underline text-sm mr-2" onclick="closeTicket(' + t.id + ')">关闭</button>');
        }
        return '<tr class="border-t border-gray-100 hover:bg-gray-50">' +
            '<td class="px-4 py-3 text-gray-500">' + t.id + '</td>' +
            '<td class="px-4 py-3 font-medium text-gray-800">' + esc(t.title) + '</td>' +
            '<td class="px-4 py-3 text-gray-600">' + esc((t.user && t.user.username) || t.user_id) + '</td>' +
            '<td class="px-4 py-3 text-gray-600">' + typeLabel(t.type) + '</td>' +
            '<td class="px-4 py-3 text-gray-600">' + priorityBadge(t.priority) + '</td>' +
            '<td class="px-4 py-3">' + statusBadge(t.status) + '</td>' +
            '<td class="px-4 py-3 text-gray-500 text-xs">' + fmtTime(t.created_at) + '</td>' +
            '<td class="px-4 py-3 text-right whitespace-nowrap">' + acts.join('') + '</td>' +
        '</tr>';
    }).join('');
}

function closeTicket(id) {
    if (!confirm('确定关闭该工单？')) return;
    $.ajax({ url: API + '/tickets/' + id + '/close', type: 'POST',
        success: function (r) {
            if (r.code === 200) { alert('已关闭'); loadTickets(); }
            else alert(r.msg || '操作失败');
        },
        error: function () { alert('请求失败'); }
    });
}

loadTickets();
</script>
</div>
</div>
{{template "admin/admin_footer.html" .}}
</body>
</html>
