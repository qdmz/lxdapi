<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }} - 设置新密码</title>
    {{if .FaviconUrl}}<link rel="icon" href="{{.FaviconUrl}}">{{end}}
    {{if .UseLocalCDN}}<script src="/static/js/tailwindcss.js"></script>{{else}}<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>{{end}}
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        :root { --content-opacity: {{if .ContentOpacity}}{{.ContentOpacity}}{{else}}92{{end}}; }
        .content-box { background-color: rgba(255,255,255, calc(var(--content-opacity)/100)) !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative" style="{{if .BgImage}}background-image: url('{{.BgImage}}'); background-size: cover; background-position: center;{{else}}background: linear-gradient(135deg, rgb(239 246 255) 0%, rgb(224 231 255) 50%, rgb(237 233 254) 100%);{{end}}">
{{if .BgImage}}<div class="absolute inset-0 bg-white" style="opacity: {{.BgOpacity}}%;"></div>{{end}}
<div class="relative z-10 w-full max-w-md px-4">
    <div class="content-box rounded-2xl shadow-2xl p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-1 text-center">设置新密码</h1>
        <p class="text-sm text-gray-500 text-center mb-5">请输入新密码（至少 6 位）</p>
        <div id="alert" class="hidden mb-4 text-sm rounded-lg px-3 py-2"></div>
        <form id="resetForm" class="space-y-4">
            <input type="hidden" name="token" value="{{ .token }}">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">新密码</label>
                <input type="password" name="password" required minlength="6" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="至少 6 位">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">确认新密码</label>
                <input type="password" name="password2" required minlength="6" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">确认重置</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600"><a href="/user/login" class="text-blue-600 hover:underline">返回登录</a></p>
    </div>
</div>
<script>
function showAlert(type, msg) {
    var el = $('#alert');
    el.removeClass('hidden bg-green-50 bg-red-50 text-green-700 text-red-700');
    el.addClass(type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700');
    el.text(msg);
}
$('#resetForm').on('submit', function (e) {
    e.preventDefault();
    var p = $('input[name=password]').val(), p2 = $('input[name=password2]').val();
    if (p !== p2) { showAlert('error', '两次输入的密码不一致'); return; }
    $('#submitBtn').prop('disabled', true).text('提交中...');
    $.ajax({
        url: '/api/user/reset-password', type: 'POST', contentType: 'application/json',
        data: JSON.stringify({ token: $('input[name=token]').val(), password: p }),
        success: function (r) {
            if (r.code === 200) {
                showAlert('success', '密码已重置，正在跳转到登录页...');
                setTimeout(function () { location.href = '/user/login'; }, 1500);
            } else { showAlert('error', r.msg || '重置失败'); }
        },
        error: function () { showAlert('error', '请求失败，请稍后重试'); },
        complete: function () { $('#submitBtn').prop('disabled', false).text('确认重置'); }
    });
});
</script>
</body>
</html>
