<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    {{if .FaviconUrl}}<link rel="icon" href="{{.FaviconUrl}}">{{end}}
    {{if .UseLocalCDN}}
    <link href="/static/css/daisyui.min.css" rel="stylesheet">
    <script src="/static/js/tailwindcss.js"></script>
    <script src="/static/js/jquery.min.js"></script>
    {{else}}
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    {{end}}
</head>
<body class="relative min-h-screen flex flex-col">
{{template "user/user_header.html" .}}
<div class="flex-1 relative" style="background-color:#f4f7fb">
<div class="relative container mx-auto px-4 py-8" style="z-index:1">

    <div class="rounded-xl border border-gray-200 p-5 mb-6 shadow-sm" style="background-color: rgba(255,255,255,0.85);">
        <h1 class="text-xl sm:text-2xl font-bold text-gray-800 flex items-center gap-2">
            <span class="iconify" data-icon="mdi:ticket-percent-outline" data-width="22"></span>我的优惠券
        </h1>
        <p class="text-sm text-gray-500 mt-1">输入券码领取优惠券，下单时可抵扣。</p>
        <div class="flex gap-2 mt-4 max-w-md">
            <input type="text" id="claimCode" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入券码">
            <button onclick="claimCoupon()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition">领取</button>
        </div>
    </div>

    <div id="couponList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

</div>
</div>

<script>
function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}
function fmtTime(s) {
    if (!s) return '';
    return String(s).replace('T', ' ').substring(0, 10);
}
function discountText(cp) {
    if (cp.type === 'percent') {
        var t = cp.value + '% off';
        if (cp.max_discount > 0) t += '（最高抵 ¥' + cp.max_discount + '）';
        return t;
    }
    return '¥' + cp.value;
}

function loadCoupons() {
    $.get('/api/user/coupons', function (r) {
        if (r.code !== 200) { alert(r.msg || '加载失败'); return; }
        renderCoupons(r.data || []);
    });
}

function renderCoupons(list) {
    var html = '';
    if (!list.length) html = '<p class="col-span-full text-center text-gray-400 py-8">暂无优惠券，输入券码领取吧</p>';
    list.forEach(function (uc) {
        var cp = uc.coupon || {};
        var expired = uc.status === 'expired' || (cp.end_at && new Date(cp.end_at) < new Date());
        var used = uc.status === 'used';
        var badge = used
            ? '<span class="px-2 py-0.5 rounded-full text-xs bg-gray-200 text-gray-500">已使用</span>'
            : (expired
                ? '<span class="px-2 py-0.5 rounded-full text-xs bg-gray-200 text-gray-500">已过期</span>'
                : '<span class="px-2 py-0.5 rounded-full text-xs bg-green-100 text-green-700">可使用</span>');
        var cardCls = (used || expired) ? 'opacity-60' : '';
        html += '<div class="rounded-xl border border-gray-200 p-4 shadow-sm ' + cardCls + '" style="background-color: rgba(255,255,255,0.9);">' +
            '<div class="flex items-start justify-between mb-2">' +
                '<div class="text-2xl font-bold text-red-500">' + esc(discountText(cp)) + '</div>' + badge +
            '</div>' +
            '<div class="text-sm font-medium text-gray-800">' + esc(cp.name || '') + '</div>' +
            '<div class="text-xs text-gray-400 mt-1 font-mono">券码：' + esc(cp.code || '') + '</div>' +
            '<div class="text-xs text-gray-400 mt-1">' +
                (cp.min_amount > 0 ? '满 ¥' + cp.min_amount + ' 可用 · ' : '') +
                '有效期至 ' + (fmtTime(cp.end_at) || '长期有效') +
            '</div>' +
        '</div>';
    });
    document.getElementById('couponList').innerHTML = html;
}

function claimCoupon() {
    var code = document.getElementById('claimCode').value.trim();
    if (!code) { alert('请输入券码'); return; }
    $.ajax({
        url: '/api/user/coupons/claim', type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ code: code }),
        success: function (r) {
            if (r.code === 200) {
                document.getElementById('claimCode').value = '';
                alert('领取成功');
                loadCoupons();
            } else alert(r.msg || '领取失败');
        },
        error: function () { alert('请求失败'); }
    });
}

loadCoupons();
</script>
{{template "user/user_footer.html" .}}
</body>
</html>
