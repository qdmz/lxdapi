<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }} - 找回密码</title>
    {{if .FaviconUrl}}<link rel="icon" href="{{.FaviconUrl}}">{{end}}
    {{if .UseLocalCDN}}<script src="/static/js/tailwindcss.js"></script>{{else}}<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>{{end}}
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        :root { --content-opacity: {{if .ContentOpacity}}{{.ContentOpacity}}{{else}}92{{end}}; }
        .content-box { background-color: rgba(255,255,255, calc(var(--content-opacity)/100)) !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative" style="{{if .BgImage}}background-image: url('{{.BgImage}}'); background-size: cover; background-position: center;{{else}}background: linear-gradient(135deg, rgb(239 246 255) 0%, rgb(224 231 255) 50%, rgb(237 233 254) 100%);{{end}}">
{{if .BgImage}}<div class="absolute inset-0 bg-white" style="opacity: {{.BgOpacity}}%;"></div>{{end}}
<!-- 统一页眉 -->
<header class="relative z-10 w-full py-4 px-6 flex items-center justify-between">
    <a href="/" class="text-lg font-bold text-gray-800">{{if .SiteName}}{{.SiteName}}{{else}}LXD 容器面板{{end}}</a>
</header>
<div class="relative z-10 w-full max-w-md px-4">
    <div class="content-box rounded-2xl shadow-2xl p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-1 text-center">找回密码</h1>
        <p class="text-sm text-gray-500 text-center mb-5">输入注册邮箱，我们会发送重置链接</p>
        <div id="alert" class="hidden mb-4 text-sm rounded-lg px-3 py-2"></div>
        <form id="forgotForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">注册邮箱</label>
                <input type="email" name="email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="you@example.com">
            </div>
            <div id="captchaRow" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">图形验证码</label>
                <div class="flex items-center gap-2">
                    <input type="text" name="captcha" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入验证码">
                    <img id="captchaImg" class="h-9 w-24 rounded cursor-pointer" alt="点击刷新" title="点击刷新" onclick="loadCaptcha()">
                </div>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">发送重置链接</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600"><a href="/user/login" class="text-blue-600 hover:underline">返回登录</a></p>
    </div>
</div>
<script>
function showAlert(type, msg) {
    var el = $('#alert');
    el.removeClass('hidden bg-green-50 bg-red-50 text-green-700 text-red-700');
    el.addClass(type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700');
    el.text(msg);
}
$(function () {
    $.get('/api/public/general-settings', function (r) {
        if (r.code === 200 && r.data && r.data.captcha_enabled) {
            $('#captchaRow').removeClass('hidden');
            loadCaptcha();
        }
    });
});
function loadCaptcha() {
    $.get('/api/public/captcha', function (r) {
        if (r.code === 200) { var img = r.image; if (img.indexOf('data:') !== 0) img = 'data:image/png;base64,' + img; $('#captchaImg').attr('src', img); }
    });
}
$('#forgotForm').on('submit', function (e) {
    e.preventDefault();
    $('#submitBtn').prop('disabled', true).text('发送中...');
    $.ajax({
        url: '/api/user/forgot-password', type: 'POST', contentType: 'application/json',
        data: JSON.stringify({ email: $('input[name=email]').val(), captcha: $('input[name=captcha]').val() }),
        success: function (r) {
            if (r.code === 200) { showAlert('success', (r.data && r.data.msg) || '重置链接已发送，请查收邮箱'); }
            else { showAlert('error', r.msg || '发送失败'); if ($('#captchaRow').is(':visible')) loadCaptcha(); }
        },
        error: function () { showAlert('error', '请求失败，请稍后重试'); },
        complete: function () { $('#submitBtn').prop('disabled', false).text('发送重置链接'); }
    });
});
</script>
<!-- 统一页脚 -->
<footer class="relative z-10 w-full py-4 text-center text-xs text-gray-500">
    {{if .SiteName}}{{.SiteName}}{{else}}LXD 容器面板{{end}} &copy; 2026
</footer>
</body>
</html>
