<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    {{if .FaviconUrl}}<link rel="icon" href="{{.FaviconUrl}}">{{end}}
    {{if .UseLocalCDN}}
    <link href="/static/css/daisyui.min.css" rel="stylesheet">
    <script src="/static/js/tailwindcss.js"></script>
    <script src="/static/js/jquery.min.js"></script>
    {{else}}
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    {{end}}
    <style>
        .content-box { background-color: rgba(255,255,255, calc(85 / 100)) !important; }
        .order-row { transition: background .15s ease; }
        .order-row:hover { background: #f8fafc; }
    </style>
</head>
<body class="relative min-h-screen flex flex-col">
{{template "user/user_header.html" .}}
<div class="flex-1 relative" style="background-color:#f4f7fb">
<div class="relative container mx-auto px-4 py-8" style="z-index:1">

    <div class="content-box rounded-xl border border-gray-200 p-5 mb-6 shadow-sm flex flex-wrap items-center justify-between gap-3">
        <div>
            <h1 class="text-xl sm:text-2xl font-bold text-gray-800 flex items-center gap-2">
                <span class="iconify text-blue-600" data-icon="mdi:receipt-text-outline" data-width="24"></span>
                我的订单
            </h1>
            <p class="text-sm text-gray-500 mt-1">查看订购记录与开通状态。</p>
        </div>
        <a href="/user/shop" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm flex items-center gap-2">
            <span class="iconify" data-icon="mdi:plus-circle-outline" data-width="18"></span>去选购
        </a>
    </div>

    <div id="alertBox" class="hidden mb-4 text-sm rounded-lg px-3 py-2"></div>

    <div class="content-box rounded-xl border border-gray-200 overflow-x-auto shadow-sm">
        <table class="min-w-full text-sm">
            <thead>
                <tr class="bg-gray-50 text-gray-600 border-b border-gray-200">
                    <th class="px-4 py-3 text-left font-medium">订单号</th>
                    <th class="px-4 py-3 text-left font-medium">产品</th>
                    <th class="px-4 py-3 text-left font-medium">规格</th>
                    <th class="px-4 py-3 text-left font-medium">金额</th>
                    <th class="px-4 py-3 text-left font-medium">状态</th>
                    <th class="px-4 py-3 text-left font-medium">开通容器</th>
                    <th class="px-4 py-3 text-left font-medium">下单时间</th>
                    <th class="px-4 py-3 text-right font-medium">操作</th>
                </tr>
            </thead>
            <tbody id="orderTable">
                <tr><td colspan="8" class="px-4 py-10 text-center text-gray-400">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 详情 -->
<div id="detailModal" class="fixed inset-0 hidden items-center justify-center bg-black/50 z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
            <h3 class="text-base font-semibold text-gray-800">订单详情</h3>
            <button onclick="closeDetail()" class="text-gray-400 hover:text-gray-600"><span class="iconify" data-icon="mdi:close" data-width="20"></span></button>
        </div>
        <div id="detailBody" class="px-5 py-4"></div>
    </div>
</div>
</div>

<script>
var API = '/api/user';
var detailCache = {};

function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}
function fmtTime(s) {
    if (!s) return '-';
    var d = new Date(s);
    if (isNaN(d.getTime())) return String(s).replace('T', ' ').substring(0, 16);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function showAlert(type, msg) {
    var el = document.getElementById('alertBox');
    el.className = 'mb-4 text-sm rounded-lg px-3 py-2 ' + (type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700');
    el.textContent = msg;
    setTimeout(function () { el.className = 'hidden mb-4 text-sm rounded-lg px-3 py-2'; }, 4000);
}

function statusBadge(s) {
    var map = {
        pending: ['待支付', 'bg-amber-100 text-amber-700'],
        paid: ['已支付', 'bg-blue-100 text-blue-700'],
        provisioning: ['开通中', 'bg-indigo-100 text-indigo-700'],
        active: ['已开通', 'bg-green-100 text-green-700'],
        failed: ['开通失败', 'bg-red-100 text-red-700'],
        cancelled: ['已关闭', 'bg-gray-200 text-gray-600']
    };
    var m = map[s] || [s || '-', 'bg-gray-100 text-gray-600'];
    return '<span class="px-2 py-0.5 rounded-full text-xs whitespace-nowrap ' + m[1] + '">' + m[0] + '</span>';
}

function loadOrders() {
    $.get(API + '/orders', function (r) {
        if (r.code !== 200) { alert(r.msg || '加载失败'); return; }
        var list = r.data || [];
        var tbody = document.getElementById('orderTable');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="px-4 py-10 text-center text-gray-400">暂无订单，<a class="text-blue-600 hover:underline" href="/user/shop">去选购</a></td></tr>';
            return;
        }
        detailCache = {};
        tbody.innerHTML = list.map(function (o) {
            detailCache[o.order_no] = o;
            var spec = o.cpu + 'C / ' + o.memory + 'M / ' + o.disk + 'G';
            var pinfo = '';
            if (o.product_info) {
                var pi = o.product_info;
                pinfo = '<div class="text-xs text-gray-400">库存 ' + (pi.stock < 0 ? '不限' : pi.stock) + ' · 限购 ' + (pi.max_per_user > 0 ? pi.max_per_user : '不限') + ' · 时¥' + (pi.price_hourly || 0) + ' 月¥' + (pi.price_monthly || 0) + ' 季¥' + (pi.price_quarterly || 0) + ' 年¥' + (pi.price_yearly || 0) + '</div>';
            }
            var acts = [];
            if (o.status === 'pending') {
                acts.push('<button class="text-blue-600 hover:underline text-sm" onclick="payOrder(\'' + esc(o.order_no) + '\')">去支付</button>');
                if (!o.recharge_amount) {
                    acts.push('<button class="text-emerald-600 hover:underline text-sm ml-3" onclick="payOrderBalance(\'' + esc(o.order_no) + '\')">余额支付</button>');
                }
            }
            if (o.status === 'pending' || o.status === 'paid') {
                acts.push('<button class="text-gray-500 hover:underline text-sm ml-3" onclick="checkOrder(\'' + esc(o.order_no) + '\')">刷新</button>');
            }
            if (o.status === 'active' && o.container_name) {
                acts.push('<a class="text-green-600 hover:underline text-sm ml-3" target="_blank" href="/user/container?name=' + encodeURIComponent(o.container_name) + '">查看</a>');
                acts.push('<button class="text-amber-600 hover:underline text-sm ml-3" onclick="renewOrder(\'' + esc(o.order_no) + '\')">续费</button>');
            }
            return '<tr class="order-row border-t border-gray-100">' +
                '<td class="px-4 py-3 font-mono text-xs text-gray-700">' + esc(o.order_no) + '</td>' +
                '<td class="px-4 py-3 text-gray-700">' + esc(o.product_name) + (o.node_name ? ' <span class="text-gray-400 text-xs">(' + esc(o.node_name) + ')</span>' : '') + pinfo + '</td>' +
                '<td class="px-4 py-3 text-gray-600">' + esc(spec) + ' × ' + o.quantity + '</td>' +
                '<td class="px-4 py-3 font-medium text-gray-800">¥ ' + Number(o.amount || 0).toFixed(2) + '</td>' +
                '<td class="px-4 py-3">' + statusBadge(o.status) + '</td>' +
                '<td class="px-4 py-3 text-gray-600">' + (o.container_name ? '<span class="font-mono text-xs">' + esc(o.container_name) + '</span>' : '<span class="text-gray-400">' + (o.provision_status === 'pending' ? '开通中' : '-') + '</span>') + '</td>' +
                '<td class="px-4 py-3 text-gray-500 text-xs">' + fmtTime(o.created_at) + '</td>' +
                '<td class="px-4 py-3 text-right whitespace-nowrap">' +
                    '<button class="text-gray-600 hover:underline text-sm mr-2" onclick="showDetail(\'' + esc(o.order_no) + '\')">详情</button>' +
                    acts.join('') +
                '</td>' +
            '</tr>';
        }).join('');
    });
}

function payOrder(orderNo) {
    var o = detailCache[orderNo];
    if (o && o.pay_url) { window.open(o.pay_url, '_blank'); showAlert('success', '支付窗口已打开，完成后请刷新订单'); return; }
    $.ajax({
        url: API + '/orders/' + orderNo + '/pay', type: 'POST',
        success: function (r) {
            if (r.code === 200 && r.data && r.data.pay_url) {
                window.open(r.data.pay_url, '_blank');
                showAlert('success', '支付窗口已打开，完成后请刷新订单');
            } else {
                showAlert('error', r.msg || '获取支付链接失败');
            }
        },
        error: function () { showAlert('error', '网络错误'); }
    });
}

function checkOrder(orderNo) { loadOrders(); }

function payOrderBalance(orderNo) {
    var o = detailCache[orderNo];
    if (!o) return;
    $.ajax({
        url: API + '/orders/pay-with-balance', type: 'POST', contentType: 'application/json',
        data: JSON.stringify({ order_no: orderNo }),
        success: function (r) {
            if (r.code === 200) {
                showAlert('success', '已使用余额支付，系统正在开通容器…');
                setTimeout(loadOrders, 1200);
            } else {
                showAlert('error', r.msg || '余额支付失败');
            }
        },
        error: function () { showAlert('error', '网络错误'); }
    });
}

function renewOrder(orderNo) {
    var o = detailCache[orderNo];
    if (!o || !o.container_name) return;
    var cycle = o.billing_cycle || 'monthly';
    var useBalance = confirm('确定为容器「' + o.container_name + '」续费「' + cycle + '」周期？\n\n点击“确定”用余额支付，点击“取消”用第三方支付。');
    $.ajax({
        url: API + '/orders/renew',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ container_name: o.container_name, billing_cycle: cycle, pay_type: useBalance ? 'balance' : 'alipay' }),
        success: function (r) {
            if (r.code === 200 && r.data && r.data.pay_url) {
                window.open(r.data.pay_url, '_blank');
                showAlert('success', '续费订单已创建，支付窗口已打开');
                setTimeout(loadOrders, 1500);
            } else if (r.code === 200 && r.data && r.data.order && r.data.order.order_no) {
                if (useBalance) {
                    payOrderBalance(r.data.order.order_no);
                } else {
                    showAlert('success', '续费订单已创建，请刷新后前往支付');
                    loadOrders();
                }
            } else {
                showAlert('error', r.msg || '创建续费订单失败');
            }
        },
        error: function () { showAlert('error', '网络错误'); }
    });
}

function showDetail(orderNo) {
    var o = detailCache[orderNo];
    if (!o) return;
    var rows = [
        ['订单号', '<span class="font-mono">' + esc(o.order_no) + '</span>'],
        ['产品', esc(o.product_name)],
        ['节点', esc(o.node_name || '-')],
        ['镜像', esc(o.image || '-')],
        ['规格', o.cpu + ' 核 / ' + o.memory + ' MB / ' + o.disk + ' GB'],
        ['计费周期', esc(o.billing_cycle || '-')],
        ['数量', o.quantity],
        ['金额', '¥ ' + Number(o.amount || 0).toFixed(2)],
        ['支付方式', esc(o.pay_type || '-')],
        ['状态', statusBadge(o.status)],
        ['开通容器', o.container_name ? '<span class="font-mono">' + esc(o.container_name) + '</span>' : '-'],
        ['到期时间', fmtTime(o.expire_at)]
    ];
    if (o.product_info) {
        rows.push(['产品库存', o.product_info.stock < 0 ? '不限' : '' + o.product_info.stock]);
        rows.push(['产品限购', o.product_info.max_per_user > 0 ? '' + o.product_info.max_per_user : '不限']);
        rows.push(['产品价格', '时 ¥' + (o.product_info.price_hourly || 0) + ' / 月 ¥' + (o.product_info.price_monthly || 0) + ' / 季 ¥' + (o.product_info.price_quarterly || 0) + ' / 年 ¥' + (o.product_info.price_yearly || 0)]);
    }
    if (o.provision_status && o.provision_status !== 'none') rows.push(['开通状态', o.provision_status]);
    if (o.provision_error) rows.push(['失败原因', '<span class="text-red-600">' + esc(o.provision_error) + '</span>']);
    document.getElementById('detailBody').innerHTML = '<div class="space-y-2 text-sm">' + rows.map(function (row) {
        return '<div class="flex items-start justify-between gap-4"><span class="text-gray-500 shrink-0">' + row[0] + '</span><span class="text-gray-800 text-right">' + row[1] + '</span></div>';
    }).join('') + '</div>';
    document.getElementById('detailModal').classList.remove('hidden');
    document.getElementById('detailModal').classList.add('flex');
}
function closeDetail() {
    document.getElementById('detailModal').classList.add('hidden');
    document.getElementById('detailModal').classList.remove('flex');
}

loadOrders();
</script>
{{template "user/user_footer.html" .}}
</body>
</html>
